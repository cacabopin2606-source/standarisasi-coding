name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./standarisasi-coding  # <-- Wajib ada karena foldernya bersarang

      - name: Run linter
        run: npm run lint
        working-directory: ./standarisasi-coding  # <-- Agar ESLint mendeteksi .eslintrc.json

      - name: Check formatting
        run: npm run format:check
        working-directory: ./standarisasi-coding

      - name: Run tests with coverage
        run: npm test -- --coverage --ci
        working-directory: ./standarisasi-coding

      - name: Enforce coverage threshold
        run: npm run coverage:check
        working-directory: ./standarisasi-coding

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: standarisasi-coding/coverage/       # <-- Path artifact disesuaikan ke subfolder
          retention-days: 7